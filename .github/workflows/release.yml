name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [minimal, advanced]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore release signing key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/glances-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=glances-release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Rename APK per app
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/glances-client-${{ matrix.app }}.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.app }}/dist/glances-client-${{ matrix.app }}.apk
