name: API Tracker

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: api-tracker
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [minimal, advanced]
    steps:
      - uses: actions/checkout@v7
      - name: Check Glances API capabilities
        run: node scripts/api-tracker.mjs
        working-directory: ${{ matrix.app }}
        env:
          GH_TOKEN: ${{ github.token }}
